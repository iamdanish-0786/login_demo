<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Sign in</h1>

            <p class="subtitle">
                Enter your email to receive a verification code.
            </p>


            <!-- EMAIL -->

            <form id="loginForm">

                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <button
                    id="sendOtpButton"
                    type="submit"
                >
                    Send OTP
                </button>

            </form>


            <!-- OTP -->

            <section
                id="otpSection"
                hidden
            >

                <h2>Verify OTP</h2>

                <p>
                    Enter the 6-digit code sent to your email.
                </p>

                <label for="otp">
                    Verification code
                </label>

                <input
                    id="otp"
                    name="otp"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="one-time-code"
                    placeholder="123456"
                >

                <button
                    id="verifyOtpButton"
                    type="button"
                >
                    Verify OTP
                </button>

            </section>


            <!-- MESSAGE -->

            <div
                id="message"
                role="alert"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <script src="/app.js"></script>

</body>

</html>
